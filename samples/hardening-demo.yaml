
apiVersion: v1
kind: Namespace
metadata:
  name: hardening-demo-a
---
apiVersion: v1
kind: Namespace
metadata:
  name: hardening-demo-b
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: hardening-demo-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:1.0
          args:
            - "-listen=:5678"
            - "-text=Hello from hardening demo A"
          ports:
            - containerPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: hardening-demo-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:1.0
          args:
            - "-listen=:5678"
            - "-text=Hello from hardening demo B"
          ports:
            - containerPort: 5678
