
apiVersion: v1
kind: Namespace
metadata:
  name: frontend
---
apiVersion: v1
kind: Namespace
metadata:
  name: backend
---
apiVersion: v1
kind: Namespace
metadata:
  name: database
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend-server
  namespace: frontend
  labels:
    run: client
    role: server
spec:
  containers:
    - name: server
      image: hashicorp/http-echo:1.0
      args: ["-listen=:5678", "-text=Hello from frontend"]
      ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-server
  namespace: frontend
spec:
  selector:
    run: client
    role: server
  ports:
    - port: 5678
      targetPort: 5678
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: frontend
  labels:
    run: client
    role: client
spec:
  containers:
    - name: client
      image: curlimages/curl:latest
      command: ["sleep", "36000"]
---
apiVersion: v1
kind: Pod
metadata:
  name: test-server
  namespace: backend
  labels:
    app: test-server
    role: server
spec:
  containers:
    - name: server
      image: hashicorp/http-echo:1.0
      args: ["-listen=:5678", "-text=Hello from backend"]
      ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: test-server
  namespace: backend
spec:
  selector:
    app: test-server
    role: server
  ports:
    - port: 5678
      targetPort: 5678
---
apiVersion: v1
kind: Pod
metadata:
  name: backend-client
  namespace: backend
  labels:
    app: test-server
    role: client
spec:
  containers:
    - name: client
      image: curlimages/curl:latest
      command: ["sleep", "36000"]
---
apiVersion: v1
kind: Pod
metadata:
  name: database-server
  namespace: database
  labels:
    app: database-server
spec:
  containers:
    - name: server
      image: hashicorp/http-echo:1.0
      args: ["-listen=:5678", "-text=Hello from database"]
      ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: database-server
  namespace: database
spec:
  selector:
    app: database-server
  ports:
    - port: 5678
      targetPort: 5678
